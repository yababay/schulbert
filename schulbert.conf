server {
    listen 80;
    server_name schulbert;
    
    # Папка, куда вы позже положите скомпилированную статику вашего Svelte-интерфейса
    root /www/data/schulbert;
    index index.html;

    # 🌟 ИСПРАВЛЕННЫЙ ВАРИАНТ: Чистый проброс без коллизии двойных слэшей
    location /api {
        # Перенаправляем запрос как есть, без принудительного отсечения на стороне Nginx
        proxy_pass http://127.0.0.1:8080;
        
        # Увеличиваем буферы заголовков, чтобы Nginx никогда больше не ругался на длину данных
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

