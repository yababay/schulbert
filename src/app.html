<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
    	<link href="%sveltekit.assets%/bootstrap.min.css" rel="stylesheet">
    	<link href="%sveltekit.assets%/bootstrap-icons.min.css" rel="stylesheet">
    	<script src="%sveltekit.assets%/bootstrap.bundle.min.js" defer></script>
		<!-- 🌟 ПОДКЛЮЧЕНИЕ PWA МАНИФЕСТА -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#0d6efd" />

		<!-- Скрипт автоматической регистрации сервис-воркера -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js')
						.then(reg => console.log('PWA Service Worker успешно зарегистрирован!'))
						.catch(err => console.log('Сбой регистрации PWA:', err));
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
